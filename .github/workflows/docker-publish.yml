name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  # ghcr.io/<owner>/<repo>. The repo name is taken from github.repository so we
  # don't have to hardcode it — change here only if you push to a different
  # registry.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Avoid double-publishing when a tag push also matches a branch push.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # main push → :latest + :<sha>
          # tag push   → :<tag> + :latest + :<sha>
          TAGS="--tag ghcr.io/${IMAGE_NAME}:${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="${TAGS} --tag ghcr.io/${IMAGE_NAME}:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            TAGS="${TAGS} --tag ghcr.io/${IMAGE_NAME}:${TAG} --tag ghcr.io/${IMAGE_NAME}:latest"
          fi

          # Strip leading space
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The Dockerfile pins oven/bun:1 and installs caddy via apt —
          # no --cache-from needed for this size. Re-add a cache step here
          # if builds start taking > 2 min.
          provenance: false

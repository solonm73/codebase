name: Publish Docker image

on:
  push:
    # Trigger on every push so feature branches can verify their build,
    # but only publish to ghcr.io from main or version tags. Pull-request
    # branches do NOT trigger this (use a separate workflow if you want
    # PR builds).
    branches:
      - "*"
    tags:
      - "v*"

env:
  # ghcr.io/<owner>/<repo>. The repo name is taken from github.repository so we
  # don't have to hardcode it — change here only if you push to a different
  # registry.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Decide whether to publish:
    #   - main branch            → publish :<sha> + :latest
    #   - tag v*                 → publish :<sha> + :<tag> + :latest
    #   - any other branch push  → build only (push: false), useful for CI
    #
    # Skip when this is a duplicate event (a tag push sometimes also
    # satisfies the branch filter).
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v') ||
        true   # always run on push — publish flag below decides whether to push
      )

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only need to log in when we're actually going to push.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # Build a JSON array — docker/build-push-action parses `tags:` as
          # one tag per element, NOT a single space-joined string.
          # The first tag becomes the canonical name in ghcr.io.
          TAGS_JSON="[\"ghcr.io/${IMAGE_NAME}:${GITHUB_SHA::7}\"]"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS_JSON="${TAGS_JSON%]},\"ghcr.io/${IMAGE_NAME}:latest\"]"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            TAGS_JSON="${TAGS_JSON%]},\"ghcr.io/${IMAGE_NAME}:${TAG}\",\"ghcr.io/${IMAGE_NAME}:latest\"]"
          fi

          # Branch-specific tag so feature branches can pull a specific
          # build without affecting :latest. Sanitize the ref name for
          # image tag rules (only [a-z0-9_.-]).
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH="${BRANCH//\//-}"   # foo/bar → foo-bar
            TAGS_JSON="${TAGS_JSON%]},\"ghcr.io/${IMAGE_NAME}:${BRANCH}\"]"
          fi

          echo "tags=${TAGS_JSON}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/Dockerfile
          # Push only on main or v* tags; on other branches build only.
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          # The Dockerfile pins oven/bun:1 and installs caddy via apt —
          # no --cache-from needed for this size. Re-add a cache step here
          # if builds start taking > 2 min.
          provenance: false
